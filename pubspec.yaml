name: dynamix
description: 'Visualize analyses in the form of graphs'

publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  flutter_slidable: ^4.0.3
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

platforms:
  android:

flutter_launcher_icons:
  image_path: 'assets/icons/icon.png'
  android: true
